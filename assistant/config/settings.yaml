assistant:
  name: VisionX
  company: VisionX Intelligence
  wake_word: Hey VisionX        # used from Phase 5

brain:
  # TEMPORARY: running on Groq (free) until there is an Anthropic key.
  # To switch back to Claude Haiku, change this one line to:  provider: anthropic
  # (and add VISIONX_ANTHROPIC_KEY to .env). The anthropic settings below are unchanged.
  provider: groq                # one file per provider in assistant/core/providers/

  # --- anthropic provider ---
  model: claude-haiku-5-5
  effort: low                   # low = fastest/cheapest routing; raise to medium if it picks wrong skills
  max_tokens: 2048
  api_key_env: VISIONX_ANTHROPIC_KEY   # name of the key in .env (never ANTHROPIC_API_KEY)

  # --- groq provider ---
  groq:
    # Chosen 2026-11-17 by a 10-command English / Roman Urdu / Urdu test:
    # gpt-oss-120b 10/10 (median 0.7s); gpt-oss-20b 9/10 (reworded a Roman Urdu message);
    # llama-3.3-70b-versatile and llama-3.1-8b-instant returned 404 for this key.
    model: openai/gpt-oss-120b
    reasoning_effort: low
    temperature: 0.2
    max_tokens: 1024
    api_key_env: GROQ_API_KEY

hotkey: ctrl+alt+space          # hold to talk, release to stop
show_timings: true              # print step timings under each command (set false once tuned)

audio:
  min_seconds: 0.3              # recordings shorter than this are ignored
  beeps: true                   # short beep on start and stop

stt:
  provider: groq                # one file per provider in assistant/interfaces/stt/
  fallback: local               # used when the provider fails or is rate limited
  # Language hint for Whisper: null (auto-detect), en, ur. Chosen from the 2026-11-17
  # stt_script_test (8 real clips): en+prompt and auto+prompt both gave Latin script 8/8;
  # en+prompt chosen (fixed language, no Hindi switch). Without the prompt: auto gave
  # Devanagari 2/8 and en translated Roman Urdu into English.
  language: en
  # Style + vocabulary hint: nudges Whisper to write Roman Urdu in Latin letters and to know
  # "VisionX" and app names. Max ~224 tokens. (v2, 2026-11-17: fixed "Paim"->"Time",
  # "vijanx"->"VisionX", "Huh"->"Haan" on the saved clips.)
  prompt: "Hey VisionX. Roman Urdu aur English commands: Chrome kholo, YouTube chalao, Calculator kholo, WhatsApp, Gmail. Ali ko message bhejo ke main late hoon. Time kya hua hai? Haan. Ji."
  retry_language: ur            # if Devanagari comes back, re-transcribe once in Urdu script
  groq:
    # large-v3 (not turbo): more accurate on the saved clips ("main" not "mein", "Jii" not "G"),
    # ~0.1-0.2 s slower. Same free tier.
    model: whisper-large-v3
    api_key_env: GROQ_API_KEY
  local:
    model: small                # faster-whisper size; see CLAUDE.md for the benchmark
    compute_type: int8
    cpu_threads: 8              # fastest on the i5-1235U in the benchmark
    preload: true               # load in the background at start so fallback is ready

whatsapp:
  # true: after your yes, VisionX presses Enter in WhatsApp, but only when WhatsApp is in front
  # and its message box holds exactly your message (an old draft there blocks sending), and it
  # only says "sent" once the box is empty. false: it only types the message.
  auto_send: true
  window_timeout: 10            # seconds to wait for WhatsApp and the typed message

chrome:
  user_data_dir: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"   # where Chrome keeps profiles

tts:
  engine: pyttsx3               # Windows built-in voices (local, free)
  voice: Zira                   # part of a voice name: Zira or David
  rate: 185                     # words per minute
